name: Import source, build and publish preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Import reviewed source files
        shell: python
        run: |
          import json
          from pathlib import Path
          files = json.loads(r'''{".gitattributes": "* text=auto\n*.dll -text\n*.wasm -text\n*.3dm -text\n*.qlplugin -text\n", ".gitignore": "bin/\nobj/\ndist/\nnode_modules/\n.vs/\n*.user\n*.suo\n.DS_Store\ntests/native-fixtures/\n", "AssemblyInfo.cs": "using System.Reflection;\nusing System.Runtime.InteropServices;\n[assembly: AssemblyTitle(\"QuickLook Rhino 3DM Viewer\")]\n[assembly: AssemblyDescription(\"Offline interactive Rhino 3DM preview for QuickLook\")]\n[assembly: AssemblyCompany(\"Independent community plugin\")]\n[assembly: AssemblyProduct(\"QuickLook.Plugin.Rhino3dmViewer\")]\n[assembly: AssemblyVersion(\"1.0.2.0\")]\n[assembly: AssemblyFileVersion(\"1.0.2.0\")]\n[assembly: ComVisible(false)]\n", "Assets/host-transfer.js": "// SPDX-License-Identifier: GPL-3.0-or-later\n// Acknowledged, bounded chunks avoid virtual-host fetch/CORS/COM-stream routing.\nconst MAX_BYTES = 512 * 1024 * 1024;\nconst CHUNK_BYTES = 384 * 1024;\nlet active = null;\n\nfunction finish(pending, error) {\n  if (active !== pending) return;\n  active = null;\n  clearTimeout(pending.timer);\n  pending.signal?.removeEventListener('abort', pending.abort);\n  if (error) pending.reject(error);\n  else pending.resolve(pending.buffer.buffer);\n}\nfunction sendNext(pending) {\n  clearTimeout(pending.timer);\n  pending.timer = setTimeout(() => {\n    pending.send({ type: 'cancelModelTransfer', transferId: pending.id });\n    finish(pending, new Error('\u5bbf\u4e3b\u4f20\u8f93\u6a21\u578b\u8d85\u65f6\u3002\u8bf7\u91cd\u65b0\u8f7d\u5165\uff1b\u82e5\u4ecd\u5931\u8d25\uff0c\u8bf7\u786e\u8ba4\u6587\u4ef6\u5df2\u4e0b\u8f7d\u5230\u672c\u673a\u3002'));\n  }, 20000);\n  pending.send({ type: 'modelChunkRequest', modelToken: pending.token, transferId: pending.id, offset: pending.received });\n}\n\nexport function readHostModel(message, { signal, progress = () => {}, send = data => window.chrome.webview.postMessage(data) } = {}) {\n  if (active) active.abort();\n  return new Promise((resolve, reject) => {\n    const total = Number(message.bytes);\n    if (!Number.isSafeInteger(total) || total <= 0 || total > MAX_BYTES || !message.modelToken) {\n      reject(new Error('\u6a21\u578b\u4f20\u8f93\u53c2\u6570\u65e0\u6548\uff0c\u6216\u6587\u4ef6\u8d85\u8fc7 512 MB\u3002\u8bf7\u5b89\u88c5\u5b8c\u6574\u7684 v1.0.2 \u63d2\u4ef6\u540e\u518d\u8bd5\u3002')); return;\n    }\n    if (signal?.aborted) { reject(new DOMException('Transfer cancelled', 'AbortError')); return; }\n    const pending = {\n      id: message.modelToken + ':' + crypto.randomUUID(), token: message.modelToken,\n      received: 0, total, buffer: new Uint8Array(total), resolve, reject, send, signal, progress, timer: null, abort: null\n    };\n    pending.abort = () => {\n      if (active !== pending) return;\n      pending.send({ type: 'cancelModelTransfer', transferId: pending.id });\n      finish(pending, new DOMException('Transfer cancelled', 'AbortError'));\n    };\n    active = pending;\n    signal?.addEventListener('abort', pending.abort, { once: true });\n    try { sendNext(pending); } catch (error) { finish(pending, error); }\n  });\n}\n\nexport function acceptHostTransfer(message) {\n  const pending = active;\n  if (!pending || message?.transferId !== pending.id) return;\n  if (message.type === 'modelTransferError') {\n    finish(pending, new Error(message.message || '\u5bbf\u4e3b\u65e0\u6cd5\u8bfb\u53d6\u6240\u9009\u6a21\u578b\u6587\u4ef6\u3002')); return;\n  }\n  if (message.type !== 'modelChunk') return;\n  try {\n    if (message.offset !== pending.received || message.total !== pending.total)\n      throw new Error('\u6a21\u578b\u6587\u4ef6\u5927\u5c0f\u6216\u4f20\u8f93\u987a\u5e8f\u53d1\u751f\u53d8\u5316\uff0c\u8bf7\u91cd\u65b0\u8f7d\u5165\u3002');\n    if (typeof message.base64 !== 'string' || message.base64.length > CHUNK_BYTES * 4 / 3 + 4)\n      throw new Error('\u6a21\u578b\u5206\u5757\u5185\u5bb9\u65e0\u6548\uff0c\u8bf7\u91cd\u65b0\u8f7d\u5165\u3002');\n    const binary = atob(message.base64);\n    if (!binary.length || binary.length > CHUNK_BYTES || pending.received + binary.length > pending.total)\n      throw new Error('\u6a21\u578b\u6570\u636e\u957f\u5ea6\u4e0d\u4e00\u81f4\uff0c\u8bf7\u91cd\u65b0\u8f7d\u5165\u3002');\n    const destination = pending.received;\n    for (let i = 0; i < binary.length; i++) pending.buffer[destination + i] = binary.charCodeAt(i);\n    pending.received += binary.length;\n    if (Boolean(message.done) !== (pending.received === pending.total))\n      throw new Error('\u6a21\u578b\u4f20\u8f93\u5c1a\u672a\u5b8c\u6574\u7ed3\u675f\uff0c\u8bf7\u91cd\u65b0\u8f7d\u5165\u3002');\n    pending.progress(pending.received, pending.total);\n    if (message.done) finish(pending);\n    else sendNext(pending);\n  } catch (error) {\n    pending.send({ type: 'cancelModelTransfer', transferId: pending.id });\n    finish(pending, error);\n  }\n}\n", "Assets/viewer.css": ":root{color-scheme:dark;--bg:#161b23;--panel:#1c222c;--line:#303846;--text:#e6eaf0;--muted:#8e9bad;--accent:#77c7b4;--hover:#303d4b;--view1:#303945;--view2:#1d242e}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:\"Segoe UI\",\"Microsoft YaHei UI\",sans-serif;background:var(--bg);color:var(--text);font-size:12px;display:flex;flex-direction:column}button,input,select{font:inherit}button{color:var(--muted);background:transparent;border:1px solid transparent;border-radius:5px;padding:6px 10px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}button:hover{background:var(--hover);color:var(--text)}button.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.35;cursor:default}button:disabled:hover{background:none}header{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 19px;border-bottom:1px solid var(--line);background:var(--panel)}.identity{display:flex;gap:11px;align-items:center;min-width:0}.identity>div{min-width:0}.mark{display:grid;place-items:center;width:32px;height:35px;border:1px solid #648f88;color:var(--accent);font-size:24px;font-weight:300;border-radius:8px 8px 8px 2px;flex:none}.identity strong{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36vw}.identity span:not(.mark){display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.4px}.toolbar{display:flex;align-items:center;gap:3px}.toolbar i{width:1px;height:19px;background:var(--line);margin:0 5px}main{flex:1;min-height:0;display:flex}aside{width:230px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:16px 12px 0}.panel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 2px}.panel-top strong{font-weight:600;letter-spacing:.8px}.panel-top button{font-size:11px;padding:3px 7px}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}.tabs button{flex:1;border-radius:0;padding:8px}.tabs button.active{border-bottom:2px solid var(--accent);background:none}input[type=search]{width:100%;padding:8px 10px;color:var(--text);border:1px solid var(--line);border-radius:5px;background:var(--bg);margin-bottom:10px;outline:none}input::placeholder{color:var(--muted)}#tree{flex:1;min-height:50px;overflow:auto;margin:0 -5px}.tree-row{display:flex;align-items:center;gap:7px;min-height:31px;border-radius:5px;margin:2px 0;padding:4px 7px;color:var(--text)}.tree-row:hover{background:var(--hover)}.tree-row.selected{background:color-mix(in srgb,var(--accent) 14%,transparent)}.tree-row.off .tree-name{color:var(--muted)}.tree-row input{accent-color:var(--accent);margin:0;flex:none;cursor:pointer}.tree-row .swatch{width:7px;height:7px;border-radius:2px;flex:none}.tree-name{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;padding:2px 0;font-size:11px;border-radius:0;min-width:0}.tree-count{color:var(--muted);font-size:10px;flex:none}.tree-empty{padding:16px 8px;color:var(--muted);line-height:1.7}.model-info{border-top:1px solid var(--line);margin-top:10px;padding:15px 3px}.model-info label{font-size:10px;color:var(--muted);letter-spacing:1px}#metadata{line-height:1.9;margin-top:8px;font-size:11px;font-variant-numeric:tabular-nums}#treeNote{font-size:10px;color:var(--muted);padding-top:5px}#viewport{flex:1;position:relative;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 36%,var(--view1),var(--view2))}#viewport canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}.viewport-top{position:absolute;top:14px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}.viewport-top>*{pointer-events:auto}.view-buttons,.viewport-top>button,.toggles{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:7px;padding:3px;box-shadow:0 4px 16px #00000010}.viewport-top>button{padding:6px 10px}.view-buttons button{padding:5px 9px;font-size:11px}.viewport-bottom{position:absolute;bottom:17px;left:15px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:3}.viewport-bottom>*{pointer-events:auto}.toggles button{font-size:11px;padding:5px 9px}.axis-key{display:flex;gap:10px;font-size:10px}.axis-key b{font-weight:500}.x{color:#e68c8c}.y{color:#8ac5a2}.z{color:#8eafe9}#selection{position:absolute;left:17px;top:62px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:var(--text);max-width:80%;font-size:11px;pointer-events:none;z-index:2}#sectionPanel{position:absolute;bottom:68px;left:16px;right:16px;z-index:3;display:flex;align-items:center;gap:11px;padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:7px}#sectionPanel label{color:var(--muted);font-size:11px}#sectionPanel select{color:var(--text);background:var(--bg);border:1px solid var(--line);padding:3px;border-radius:3px}#sectionPanel input{flex:1;accent-color:var(--accent)}#sectionPanel span{font-size:10px;color:var(--muted)}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:color-mix(in srgb,var(--bg) 87%,transparent);backdrop-filter:blur(8px)}[hidden]{display:none!important}.loading-card,.error-card{text-align:center;width:min(470px,85%);padding:30px}.loading-card strong{display:block;font-weight:500;font-size:16px;margin:23px 0 10px}.loading-card p,.error-card p{color:var(--muted);line-height:1.8;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.spinner{width:29px;height:29px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.progress{height:3px;border-radius:3px;margin:24px auto 0;background:var(--line);max-width:220px;overflow:hidden}.progress span{height:100%;background:var(--accent);width:15%;display:block;transition:width .25s}.error-sign{display:grid;place-items:center;width:40px;height:40px;border:1px solid #d19976;color:#deb89c;border-radius:50%;margin:0 auto 20px;font-size:22px}.error-card h2{font-size:17px;font-weight:500}.error-card button{color:var(--accent);border:1px solid var(--line);margin-top:13px}#warnings{flex:none;max-height:85px;overflow:auto;padding:10px 18px;background:#3c3024;color:#e3c69d;font-size:11px;line-height:1.7;border-top:1px solid #665034}#warnings button{float:right;padding:0 5px;font-size:17px;color:inherit}footer{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 15px;color:var(--muted);font-size:10px;border-top:1px solid var(--line);background:var(--panel)}footer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.light{color-scheme:light;--bg:#e8ecf0;--panel:#f4f6f8;--line:#d5dce3;--text:#25313d;--muted:#768392;--accent:#2a8776;--hover:#e4e9ee;--view1:#fcfdfe;--view2:#d8e0e7}body.sidebar-hidden aside{display:none}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}@media(max-width:820px){aside{width:196px}.toolbar button{padding:5px 7px}.identity strong{max-width:27vw}footer span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.spinner{animation-duration:1.5s}}\n", "Assets/viewer.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'\">\n  <title>Rhino 3DM Preview</title>\n  <link rel=\"stylesheet\" href=\"viewer.css?v=1.0.2\">\n  <script type=\"module\" src=\"viewer.bundle.js?v=1.0.2\"></script>\n</head>\n<body>\n  <header>\n    <div class=\"identity\"><span class=\"mark\">3</span><div><strong id=\"filename\">Rhino 3DM</strong><span id=\"subtitle\">\u672c\u5730\u6a21\u578b\u9884\u89c8</span></div></div>\n    <div class=\"toolbar\" aria-label=\"\u663e\u793a\u6a21\u5f0f\">\n      <button data-mode=\"original\" class=\"active\" title=\"\u6587\u4ef6\u6750\u8d28 / \u7269\u4f53\u8272\">\u539f\u59cb</button>\n      <button data-mode=\"clay\" title=\"\u7edf\u4e00\u7070\u6a21\">\u7070\u6a21</button>\n      <button data-mode=\"wire\" title=\"\u7ebf\u6846 \u00b7 W\">\u7ebf\u6846</button>\n      <button data-mode=\"color\" title=\"\u81ea\u52a8\u4e3a\u4e0d\u540c\u5bf9\u8c61\u5206\u914d\u989c\u8272 \u00b7 C\">\u5f69\u8272</button>\n      <i></i><button id=\"projection\" title=\"\u5207\u6362\u6b63\u4ea4 / \u900f\u89c6 \u00b7 O\">\u900f\u89c6</button>\n      <button id=\"theme\" title=\"\u5207\u6362\u80cc\u666f\">\u6d45\u8272</button>\n    </div>\n  </header>\n  <main>\n    <aside id=\"sidebar\">\n      <div class=\"panel-top\"><strong>\u6a21\u578b\u7ed3\u6784</strong><button id=\"resetVisibility\" title=\"\u6062\u590d\u6587\u4ef6\u539f\u59cb\u663e\u9690\">\u6062\u590d</button></div>\n      <div class=\"tabs\"><button id=\"layersTab\" class=\"active\">\u56fe\u5c42</button><button id=\"objectsTab\">\u5bf9\u8c61</button></div>\n      <input id=\"search\" type=\"search\" placeholder=\"\u67e5\u627e\u56fe\u5c42\u6216\u5bf9\u8c61\u2026\" aria-label=\"\u67e5\u627e\u56fe\u5c42\u6216\u5bf9\u8c61\">\n      <div id=\"tree\" role=\"tree\"></div>\n      <div id=\"treeNote\"></div>\n      <div class=\"model-info\"><label>\u6a21\u578b\u4fe1\u606f</label><div id=\"metadata\">\u7b49\u5f85\u8f7d\u5165</div></div>\n    </aside>\n    <section id=\"viewport\" aria-label=\"\u4e09\u7ef4\u6a21\u578b\u9884\u89c8\">\n      <div class=\"viewport-top\"><button id=\"toggleSidebar\" title=\"\u6a21\u578b\u7ed3\u6784 \u00b7 T\">\u7ed3\u6784</button><div class=\"view-buttons\"><button data-view=\"iso\" class=\"active\" title=\"\u7b49\u8f74\u6d4b \u00b7 1\">\u7b49\u8f74</button><button data-view=\"front\" title=\"\u524d\u89c6 \u00b7 2\">\u524d</button><button data-view=\"right\" title=\"\u53f3\u89c6 \u00b7 3\">\u53f3</button><button data-view=\"top\" title=\"\u9876\u89c6 \u00b7 4\">\u9876</button><button id=\"fit\" title=\"\u9002\u5e94\u53ef\u89c1\u6a21\u578b \u00b7 F\">\u9002\u5e94</button></div></div>\n      <div id=\"selection\" hidden></div>\n      <div class=\"viewport-bottom\"><div class=\"toggles\"><button id=\"grid\" class=\"active\" title=\"\u5730\u9762\u7f51\u683c\">\u7f51\u683c</button><button id=\"sectionToggle\" title=\"\u5256\u5207 \u00b7 S\">\u5256\u5207</button><button id=\"isolate\" disabled title=\"\u4ec5\u663e\u793a\u9009\u4e2d\u5bf9\u8c61 \u00b7 I\">\u72ec\u663e</button><button id=\"showAll\" title=