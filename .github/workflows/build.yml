     \"optional\": true,\n      \"os\": [\n        \"win32\"\n      ],\n      \"engines\": {\n        \"node\": \">=18\"\n      }\n    },\n    \"node_modules/@esbuild/win32-x64\": {\n      \"version\": \"0.25.11\",\n      \"resolved\": \"https://registry.npmjs.org/@esbuild/win32-x64/-/win32-x64-0.25.11.tgz\",\n      \"integrity\": \"sha512-D7Hpz6A2L4hzsRpPaCYkQnGOotdUpDzSGRIv9I+1ITdHROSFUWW95ZPZWQmGka1Fg7W3zFJowyn9WGwMJ0+KPA==\",\n      \"cpu\": [\n        \"x64\"\n      ],\n      \"dev\": true,\n      \"license\": \"MIT\",\n      \"optional\": true,\n      \"os\": [\n        \"win32\"\n      ],\n      \"engines\": {\n        \"node\": \">=18\"\n      }\n    },\n    \"node_modules/esbuild\": {\n      \"version\": \"0.25.11\",\n      \"resolved\": \"https://registry.npmjs.org/esbuild/-/esbuild-0.25.11.tgz\",\n      \"integrity\": \"sha512-KohQwyzrKTQmhXDW1PjCv3Tyspn9n5GcY2RTDqeORIdIJY8yKIF7sTSopFmn/wpMPW4rdPXI0UE5LJLuq3bx0Q==\",\n      \"dev\": true,\n      \"hasInstallScript\": true,\n      \"license\": \"MIT\",\n      \"bin\": {\n        \"esbuild\": \"bin/esbuild\"\n      },\n      \"engines\": {\n        \"node\": \">=18\"\n      },\n      \"optionalDependencies\": {\n        \"@esbuild/aix-ppc64\": \"0.25.11\",\n        \"@esbuild/android-arm\": \"0.25.11\",\n        \"@esbuild/android-arm64\": \"0.25.11\",\n        \"@esbuild/android-x64\": \"0.25.11\",\n        \"@esbuild/darwin-arm64\": \"0.25.11\",\n        \"@esbuild/darwin-x64\": \"0.25.11\",\n        \"@esbuild/freebsd-arm64\": \"0.25.11\",\n        \"@esbuild/freebsd-x64\": \"0.25.11\",\n        \"@esbuild/linux-arm\": \"0.25.11\",\n        \"@esbuild/linux-arm64\": \"0.25.11\",\n        \"@esbuild/linux-ia32\": \"0.25.11\",\n        \"@esbuild/linux-loong64\": \"0.25.11\",\n        \"@esbuild/linux-mips64el\": \"0.25.11\",\n        \"@esbuild/linux-ppc64\": \"0.25.11\",\n        \"@esbuild/linux-riscv64\": \"0.25.11\",\n        \"@esbuild/linux-s390x\": \"0.25.11\",\n        \"@esbuild/linux-x64\": \"0.25.11\",\n        \"@esbuild/netbsd-arm64\": \"0.25.11\",\n        \"@esbuild/netbsd-x64\": \"0.25.11\",\n        \"@esbuild/openbsd-arm64\": \"0.25.11\",\n        \"@esbuild/openbsd-x64\": \"0.25.11\",\n        \"@esbuild/openharmony-arm64\": \"0.25.11\",\n        \"@esbuild/sunos-x64\": \"0.25.11\",\n        \"@esbuild/win32-arm64\": \"0.25.11\",\n        \"@esbuild/win32-ia32\": \"0.25.11\",\n        \"@esbuild/win32-x64\": \"0.25.11\"\n      }\n    },\n    \"node_modules/rhino3dm\": {\n      \"version\": \"8.35.0\",\n      \"resolved\": \"https://registry.npmjs.org/rhino3dm/-/rhino3dm-8.35.0.tgz\",\n      \"integrity\": \"sha512-YcMDgOT7m132Zd/Nw1AAMFkrtpx2SD30V7Mq3P7jfab6ItURXCOdS8dHe+bMGiNQPRJuYEX+Nvos6c9T1xJ6tA==\",\n      \"license\": \"MIT\"\n    },\n    \"node_modules/three\": {\n      \"version\": \"0.186.1\",\n      \"resolved\": \"https://registry.npmjs.org/three/-/three-0.186.1.tgz\",\n      \"integrity\": \"sha512-blFeqb49wRCSGUGj7gtpfnSGHy2lwDk94RhUmS1c/hTby70kvChbWpkJ4Pm1390LqzzvTmzgXKHPEafJwCb8jA==\",\n      \"license\": \"MIT\"\n    }\n  }\n}\n", "package.json": "{\n  \"private\": true,\n  \"name\": \"quicklook-rhino3dm-viewer\",\n  \"version\": \"1.0.2\",\n  \"scripts\": { \"build:web\": \"node build-web.cjs\" },\n  \"dependencies\": { \"three\": \"0.186.1\", \"rhino3dm\": \"8.35.0\" },\n  \"devDependencies\": { \"esbuild\": \"0.25.11\" }\n}\n", "tests/ModelTransferTests.cs": "using System;\nusing System.IO;\nusing System.Linq;\nusing System.Collections.Generic;\nusing System.Threading.Tasks;\nusing QuickLook.Plugin.Rhino3dmViewer;\n\ninternal static class ModelTransferTests\n{\n    private static int passed;\n    private static void Check(bool condition, string name)\n    { if (!condition) throw new Exception(name); passed++; Console.WriteLine(\"PASS \" + name); }\n    public static int Main(string[] args)\n    {\n        try { Run(args[0]).GetAwaiter().GetResult(); Console.WriteLine(\"TOTAL \" + passed); return 0; }\n        catch (Exception ex) { Console.Error.WriteLine(ex); return 1; }\n    }\n    private static async Task Run(string folder)\n    {\n        Directory.CreateDirectory(folder);\n        string path = Path.Combine(folder, \"\u4e2d\u6587 \u4f20\u8f93\u6d4b\u8bd5.3dm\");\n        byte[] expected = new byte[ModelTransfer.ChunkBytes * 3 + 17];\n        for (int i = 0; i < expected.Length; i++) expected[i] = (byte)((i * 31 + 17) % 256);\n        File.WriteAllBytes(path, expected);\n        using (var transfer = new ModelTransfer(path, \"native-test\"))\n        {\n            var received = new List<byte>();\n            long offset = 0; int chunks = 0;\n            while (offset < expected.Length)\n            {\n                var chunk = await transfer.ReadNextAsync(offset);\n                byte[] data = Convert.FromBase64String(chunk.base64);\n                Check(chunk.type == \"modelChunk\" && chunk.transferId == \"native-test\" && chunk.offset == offset, \"chunk identity \" + chunks);\n                Check(data.Length <= ModelTransfer.ChunkBytes && chunk.total == expected.Length, \"bounded chunk \" + chunks);\n                received.AddRange(data); offset += data.Length; chunks++;\n                Check(chunk.done == (offset == expected.Length), \"completion marker \" + chunks);\n            }\n            Check(chunks == 4 && received.SequenceEqual(expected), \"multi-chunk bytes are exact; Unicode path works\");\n        }\n        using (var transfer = new ModelTransfer(path, \"wrong-order\"))\n        {\n            bool rejected = false;\n            try { await transfer.ReadNextAsync(20); } catch (InvalidDataException) { rejected = true; }\n            Check(rejected, \"reject out-of-order read\");\n        }\n        var cancelled = new ModelTransfer(path, \"cancel\"); cancelled.Dispose();\n        bool cancellation = false;\n        try { await cancelled.ReadNextAsync(0); } catch (ObjectDisposedException) { cancellation = true; }\n        Check(cancellation, \"cancelled transfer cannot read\");\n        bool missing = false;\n        try { using (var t = new ModelTransfer(path + \".missing\", \"missing\")) { } } catch (FileNotFoundException) { missing = true; }\n        Check(missing, \"missing file produces error\");\n        string empty = Path.Combine(folder, \"empty.3dm\"); File.WriteAllBytes(empty, new byte[0]);\n        bool emptyRejected = false;\n        try { using (var t = new ModelTransfer(empty, \"empty\")) { } } catch (IOException) { emptyRejected = true; }\n        Check(emptyRejected, \"empty file produces error\");\n    }\n}\n", "tests/ModelTransferTests.csproj": "<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n    <TargetFramework>net8.0</TargetFramework>\n    <ImplicitUsings>disable</ImplicitUsings>\n    <Nullable>disable</Nullable>\n  </PropertyGroup>\n  <ItemGroup>\n    <Compile Include=\"..\\ModelTransfer.cs\" Link=\"ModelTransfer.cs\" />\n  </ItemGroup>\n</Project>\n", "Samples/README.md": "Rhino-Preview-Demo.3dm is generated by the initial build workflow from simple meshes. It contains no user production geometry.\n", "lib/README.md": "QuickLook.Common.dll is a build-time reference only, obtained from Mostafa214/QuickLook.Plugin.StepViewer commit 8d2d8ec712b440dced15093644919a9468348960. SHA-256: a1971635913f89968e9b5a55eb05ca28b06881caefbda9e3a0eee8b33c979576. Source and license: QL-Win/QuickLook, GPL-3.0-or-later.\n"}''')
          for name, text in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8', newline='')
          print('Imported', len(files), 'source and documentation files')
      - name: Fetch pinned build reference
        shell: python
        run: |
          import hashlib, urllib.request
          from pathlib import Path
          p=Path('lib/QuickLook.Common.dll')
          p.parent.mkdir(exist_ok=True)
          data=urllib.request.urlopen('https://raw.githubusercontent.com/Mostafa214/QuickLook.Plugin.StepViewer/8d2d8ec712b440dced15093644919a9468348960/lib/QuickLook.Common.dll').read()
          assert hashlib.sha256(data).hexdigest() == 'a1971635913f89968e9b5a55eb05ca28b06881caefbda9e3a0eee8b33c979576'
          p.write_bytes(data)
      - name: Build offline web resources
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build:web
          if ($LASTEXITCODE -ne 0) { throw 'Web resource build failed' }
          python -m pip install rhino3dm==8.35.0
          if ($LASTEXITCODE -ne 0) { throw 'Demo dependency install failed' }
      - name: Generate non-confidential sample
        shell: python
        run: |
          import rhino3dm as r
          from pathlib import Path
          doc=r.File3dm()
          for i in range(3):
              mesh=r.Mesh()
              for x,y,z in [(0,0,0),(8,0,0),(0,8,0),(0,0,8)]: mesh.Vertices.Add(x+i*12,y,z)
              for a,b,c in [(0,2,1),(0,1,3),(1,2,3),(2,0,3)]: mesh.Faces.AddFace(a,b,c)
              mesh.Normals.ComputeNormals()
              attr=r.ObjectAttributes()
              attr.Name='Demo object '+str(i+1)
              doc.Objects.AddMesh(mesh,attr)
          Path('Samples').mkdir(exist_ok=True)
          assert doc.Write('Samples/Rhino-Preview-Demo.3dm',8)
      - name: Commit complete source tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- . ':!.github'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Add viewer assets, licenses, tests and generated sample'
            if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Source push failed' }
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
      - name: Test host model transfer
        shell: pwsh
        run: dotnet run --project tests/ModelTransferTests.csproj -- "$env:RUNNER_TEMP/rhino-transfer-tests"
      - name: Build and package plugin
        shell: pwsh
        run: ./build-plugin.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Rhino3dmViewer-qlplugin
          path: dist/*.qlplugin
          if-no-files-found: error
      - name: Publish v1.0.2 preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v1.0.2 dist/QuickLook.Plugin.Rhino3dmViewer_v1.0.2.qlplugin --title "Rhino3dmViewer v1.0.2 Preview" --notes-file docs/RELEASE-NOTES.md --prerelease --target main
