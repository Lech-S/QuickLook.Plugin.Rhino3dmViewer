and this permission notice shall be included in\nall copies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN\nTHE SOFTWARE.\n", "LICENSES/WebView2-LICENSE.txt": "Copyright (C) Microsoft Corporation. All rights reserved.\n\nRedistribution and use in source and binary forms, with or without\nmodification, are permitted provided that the following conditions are\nmet:\n\n   * Redistributions of source code must retain the above copyright\nnotice, this list of conditions and the following disclaimer.\n   * Redistributions in binary form must reproduce the above\ncopyright notice, this list of conditions and the following disclaimer\nin the documentation and/or other materials provided with the\ndistribution.\n   * The name of Microsoft Corporation, or the names of its contributors \nmay not be used to endorse or promote products derived from this\nsoftware without specific prior written permission.\n\nTHIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS\n\"AS IS\" AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT\nLIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR\nA PARTICULAR PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT\nOWNER OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL,\nSPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT\nLIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE,\nDATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY\nTHEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT\n(INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE\nOF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.", "LICENSES/fflate-MIT.txt": "MIT License\n\nCopyright (c) 2026 Arjun Barrett\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.", "LICENSES/rhino3dm-MIT.txt": "MIT License\n\nCopyright (c) 2023 Robert McNeel & Associates\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n", "ModelTransfer.cs": "// SPDX-License-Identifier: GPL-3.0-or-later\nusing System;\nusing System.IO;\nusing System.Threading;\nusing System.Threading.Tasks;\n\nnamespace QuickLook.Plugin.Rhino3dmViewer\n{\n    // Transport only: no WPF/WebView2 dependency, so this code can be exercised separately.\n    internal sealed class ModelTransfer : IDisposable\n    {\n        public const int ChunkBytes = 384 * 1024;\n        public const long MaximumBytes = 512L * 1024 * 1024;\n        private readonly FileStream stream;\n        private readonly CancellationTokenSource cancellation = new CancellationTokenSource();\n        private long nextOffset;\n        private bool reading;\n        private volatile bool disposed;\n        public string Id { get; private set; }\n        public long Length { get; private set; }\n\n        public ModelTransfer(string path, string id)\n        {\n            Id = id;\n            stream = new FileStream(path, FileMode.Open, FileAccess.Read,\n                FileShare.ReadWrite | FileShare.Delete, 65536, true);\n            Length = stream.Length;\n            if (Length == 0 || Length > MaximumBytes)\n            {\n                stream.Dispose();\n                throw new IOException(\"\u6a21\u578b\u6587\u4ef6\u4e3a\u7a7a\uff0c\u6216\u8d85\u8fc7\u672c\u7248\u652f\u6301\u7684 512 MB\u3002\");\n            }\n        }\n\n        public async Task<ModelChunk> ReadNextAsync(long offset)\n        {\n            if (disposed) throw new ObjectDisposedException(\"ModelTransfer\");\n            if (reading) throw new InvalidOperationException(\"\u4e0a\u4e00\u4e2a\u6a21\u578b\u5206\u5757\u5c1a\u672a\u8bfb\u53d6\u5b8c\u6210\u3002\");\n            if (offset != nextOffset) throw new InvalidDataException(\"\u6a21\u578b\u5206\u5757\u987a\u5e8f\u4e0d\u4e00\u81f4\uff0c\u8bf7\u91cd\u65b0\u8f7d\u5165\u3002\");\n            if (offset >= Length) throw new InvalidDataException(\"\u6a21\u578b\u6570\u636e\u5df2\u7ecf\u4f20\u8f93\u5b8c\u6210\u3002\");\n            reading = true;\n            CancellationToken ct = cancellation.Token;\n            try\n            {\n                if (stream.Length != Length) throw new IOException(\"\u6a21\u578b\u6587\u4ef6\u5728\u9884\u89c8\u671f\u95f4\u53d1\u751f\u53d8\u5316\uff0c\u8bf7\u91cd\u65b0\u8f7d\u5165\u3002\");\n                int wanted = (int)Math.Min(ChunkBytes, Length - offset);\n                byte[] buffer = new byte[wanted];\n                int received = 0;\n                while (received < wanted)\n                {\n                    int count = await stream.ReadAsync(buffer, received, wanted - received, ct).ConfigureAwait(false);\n                    if (count == 0) throw new EndOfStreamException(\"\u6a21\u578b\u6587\u4ef6\u672a\u80fd\u5b8c\u6574\u8bfb\u53d6\uff0c\u8bf7\u786e\u8ba4\u6587\u4ef6\u5df2\u4e0b\u8f7d\u5230\u672c\u673a\u3002\");\n                    received += count;\n                }\n                ct.ThrowIfCancellationRequested();\n                nextOffset += received;\n                return new ModelChunk {\n                    type = \"modelChunk\", transferId = Id, offset = offset, total = Length,\n                    base64 = Convert.ToBase64String(buffer), done = nextOffset == Length\n                };\n            }\n            finally { reading = false; }\n        }\n\n        public void Dispose()\n        {\n            if (disposed) return;\n            disposed = true;\n            cancellation.Cancel();\n            stream.Dispose();\n            cancellation.Dispose();\n        }\n    }\n\n    internal sealed class ModelChunk\n    {\n        public string type;\n        public string transferId;\n        public long offset;\n        public long total;\n        public string base64;\n        public bool done;\n    }\n}\n", "Plugin.cs": "// SPDX-License-Identifier: GPL-3.0-or-later\nusing System;\nusing System.IO;\nusing System.Windows;\nusing QuickLook.Common.Plugin;\n\nnamespace QuickLook.Plugin.Rhino3dmViewer\n{\n    public sealed class Plugin : IViewer\n    {\n        private RhinoPreview preview;\n        public int Priority { get { return 30; } }\n        public void Init() { }\n        public bool CanHandle(string path)\n        {\n            // Keep probing cheap; do not read cloud placeholders during plugin discovery.\n            return !String.IsNullOrEmpty(path) && !Directory.Exists(path)\n                && String.Equals(Path.GetExtension(path), \".3dm\", StringComparison.OrdinalIgnoreCase);\n        }\n        public void Prepare(string path, ContextObject context)\n        {\n            context.SetPreferredSizeFit(new Size(1120, 760), 0.88);\n        }\n        public void View(string path, ContextObject context)\n        {\n            Cleanup();\n            context.Title = Path.GetFileName(path) + \" \u00b7 Rhino 3DM\";\n            preview = new RhinoPreview(path);\n            context.ViewerContent = preview;\n            // The viewer has its own visible progress/error UI, including runtime failures.\n            context.IsBusy = false;\n        }\n        public void Cleanup()\n        {\n            if (preview != null) { preview.Dispose(); preview = null; }\n        }\n    }\n}\n", "QuickLook.Plugin.Metadata.config": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<Metadata>\n  <Namespace>QuickLook.Plugin.Rhino3dmViewer</Namespace>\n  <Version>1.0.2</Version>\n  <Description>Offline Rhino 3DM preview: orbit, layers, objects, display modes and section view.</Description>\n</Metadata>\n", "QuickLook.Plugin.Rhino3dmViewer.csproj": "<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>net48</TargetFramework>\n    <OutputType>Library</OutputType>\n    <AssemblyName>QuickLook.Plugin.Rhino3dmViewer</AssemblyName>\n    <RootNamespace>QuickLook.Plugin.Rhino3dmViewer</RootNamespace>\n    <UseWPF>true</UseWPF>\n    <EnableWindowsTargeting>true</EnableWindowsTargeting>\n    <GenerateAssemblyInfo>false</GenerateAssemblyInfo>\n    <Deterministic>true</Deterministic>\n  </PropertyGroup>\n  <ItemGroup>\n    <Compile Remove=\"tests\\**\\*.cs\" />\n  </ItemGroup>\n  <ItemGroup>\n    <PackageReference Include=\"Microsoft.NETFramework.ReferenceAssemblies\" Version=\"1.0.3\" PrivateAssets=\"All\" />\n    <PackageReference Include=\"Microsoft.Web.WebView2\" Version=\"1.0.2592.51\" />\n    <Reference Include=\"QuickLook.Common\"><HintPath>lib\\QuickLook.Common.dll</HintPath><Private>false</Private></Reference>\n    <Reference Include=\"System.Drawing\" />\n    <Reference Include=\"System.Web.Extensions\" />\n  </ItemGroup>\n  <ItemGroup>\n    <None Update=\"Assets\\**\"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></None>\n    <None Update=\"QuickLook.Plugin.Metadata.config\"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></None>\n    <None Update=\"LICENSES\\**\"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></None>\n  </ItemGroup>\n</Project>\n", "README.md": "# QuickLook.Plugin.Rhino3dmViewer\n\nAn independent, offline Rhino `.3dm` preview plugin for [QuickLook for Windows](https://github.com/QL-Win/QuickLook).\n\n[\u7b80\u4f53\u4e2d\u6587](README.zh-CN.md)\n\n[Download the latest preview](https://github.com/Lech-S/QuickLook.Plugin.Rhino3dmViewer/releases) \u00b7 [Release notes](docs/RELEASE-NOTES.md)\n\n**Current package: v1.0.2, preview/beta.** The plugin compiles and its browser renderer and binary transfer logic have automated coverage. End-to-end testing inside Windows QuickLook has not yet been completed by the authoring environment. Please report the QuickLook version, plugin version, Windows version and the visible error when reporting a problem. Do not post confidential production models publicly.\n\n## Features\n\n- Local, read-only previews without a Rhino installation. JavaScript and WASM resources are bundled; models are not uploaded.\n- Meshes, curves, points/point clouds, and Breps/extrusions with saved display meshes.\n- Original materials/display colors, clay, wireframe and automatic object colors. The same document receives the same automatic colors when reopened.\n- Orbit, pan, zoom, fit, standard views and perspective/orthographic projection.\n- Layers/objects, search, visibility, inherited layer visibility, selection and isolation.\n- Uncapped X/Y/Z clipping planes and display-geometry bounding-box dimensions.\n- Acknowledged host-to-viewer binary chunks. Model loading does not depend on intercepting requests to a WebView2 virtual host.\n\nThe current UI is in Simplified Chinese. This is a community plugin and is not an official product of McNeel, Microsoft or QuickLook.\n\n## Install\n\nRequirements: Windows 10/11, QuickLook, .NET Framework 4.8+, WebView2 Evergreen Runtime and a WebGL 2-capable graphics driver.\n\n1. Download `QuickLook.Plugin.Rhino3dmViewer_v1.0.2.qlplugin` from this repository's Releases.\n2. Keep QuickLook running. Select the `.qlplugin` file in File Explorer and press **Space**.\n3. Install the plugin, then fully restart QuickLook.\n4. Select a `.3dm` file and press **Space**. Start with [the generated demo](Samples/Rhino-Preview-Demo.3dm).\n\nThis plugin extends format support. It does not fix QuickLook's selection integration with Tencent desktop organization software. Use File Explorer for installation and initial testing.\n\n## Display-mesh limitation\n\nrhino3dm/openNURBS is a geometry/file-reading library, not the full Rhino meshing kernel. Breps and extrusions require display meshes saved in the document. If they are missing, open the model in Rhino, switch to a shaded/rendered viewport, wait for it to finish and save without `Save small`/geometry-only options.\n\nOther limits:\n\n- Maximum file size: 512 MiB. Dense SubD and large assemblies can consume substantial memory.\n- Rhino 5\u20138-format samples have been exercised. Rhino 9, linked blocks, complex nested blocks and all SubD variants are not verified.\n- Materials are approximated by the viewer. External texture references and external linked files are not read. Renderer-specific materials/lighting are not reproduced.\n- Section planes do not cap the cut. Bounding boxes use converted display geometry and are not precision CAD measurements.\n- Model objects may be expanded during conversion; the object list is not a full Rhino assembly tree.\n- x86/x64/ARM64 WebView2 loaders are included, but all Windows architectures, Store deployment and plugin coexistence still need testing.\n\n## Shortcuts\n\n| Input | Action |\n|---|---|\n| Left drag / right drag / wheel | Orbit / pan / zoom |\n| Double-click geometry | Focus that geometry |\n| F | Fit visible geometry |\n| 1 / 2 / 3 / 4 | Isometric / front / right / top |\n| O | Orthographic/perspective |\n| W / C | Wireframe/original; automatic colors/original |\n| T / I / S | Structure panel / isolate / section |\n| Space / Esc / F11 | Close preview / close preview / QuickLook fullscreen |\n\n## Build\n\nUse Windows and the .NET 8 SDK. The browser assets are already built:\n\n```powershell\npowershell -NoProfile -File .\\build-plugin.ps1\n```\n\nTo rebuild browser code too, install Node.js 20+:\n\n```powershell\npowershell -NoProfile -File .\\build-plugin.ps1 -RebuildWeb\n```\n\nThe package is written to `dist/`. The build-time `lib/QuickLook.Common.dll` is not shipped into the user's QuickLook installation.\n\nThe supplied GitHub Actions workflow builds the plugin on Windows and runs the host transfer tests. Windows build and host-transfer checks run in GitHub Actions; interactive desktop validation is a separate check.\n\n## Validation and contribution\n\nSee [VALIDATION.md](VALIDATION.md) and [recorded results](docs/validation-results/). These results distinguish browser/transport tests from Windows integration testing.\n\nFor bugs, include reproduction steps and error text. If needed, provide a minimal, non-confidential model. Improvements to English localization, Windows compatibility and large-model handling are welcome.\n\n## License and acknowledgments\n\nOriginal plugin code is GPL-3.0-or-later; see [LICENSE](LICENSE). Third-party components retain their own licenses in [LICENSES](LICENSES).\n\n- QuickLook plugin interface: [QL-Win/QuickLook](https://github.com/QL-Win/QuickLook).\n- Integration approach reference: [Mostafa214/QuickLook.Plugin.StepViewer](https://github.com/Mostafa214/QuickLook.Plugin.StepViewer).\n- Geometry reader: [mcneel/rhino3dm](https://github.com/mcneel/rhino3dm), 8.35.0.\n- Renderer and 3DM loader: [Three.js](https://github.com/mrdoob/three.js), 0.186.1.\n- WebView2 SDK: 1.0.2592.51.\n\nThe checked-in QuickLook.Common reference was obtained from the referenced StepViewer repository and is used only for compilation. Its source is available through QuickLook; it is covered by the bundled QuickLook GPL license. `Samples/Rhino-Preview-Demo.3dm` is a generated demonstration, not a user production model.\n", "README.zh-CN.md": "# QuickLook Rhino 3DM \u9884\u89c8\u63d2\u4ef6 v1.0.2\uff08\u6d4b\u8bd5\u7248\uff09\n\n\u5728 Windows \u8d44\u6e90\u7ba1\u7406\u5668\u4e2d\u9009\u4e2d `.3dm` \u6587\u4ef6\uff0c\u6309\u7a7a\u683c\u6253\u5f00\u4e09\u7ef4\u9884\u89c8\u3002\u53c2\u8003 StepViewer \u7684 QuickLook + WebView2 \u96c6\u6210\u601d\u8def\uff0c\u91c7\u7528\u72ec\u7acb\u5b9e\u73b0\u7684 C# \u5bbf\u4e3b\u548c\u754c\u9762\uff0c\u4f7f\u7528 McNeel \u5b98\u65b9 rhino3dm \u4e0e Three.js Rhino3dmLoader \u8bfb\u53d6\u6a21\u578b\u3002\n\n## \u5305\u5185\u6587\u4ef6\n\n- `QuickLook.Plugin.Rhino3dmViewer_v1.0.2.qlplugin`\uff1a\u5df2\u7ecf\u7f16\u8bd1\u3001\u53ef\u76f4\u63a5\u5b89\u88c5\u7684\u63d2\u4ef6\u3002\n- \u4ed3\u5e93\u6839\u76ee\u5f55\uff1a\u5b8c\u6574\u7684\u63d2\u4ef6\u548c\u67e5\u770b\u5668\u6e90\u4ee3\u7801\u3001\u79bb\u7ebf\u8d44\u6e90\u3001\u6784\u5efa\u8bf4\u660e\u3001\u7b2c\u4e09\u65b9\u8bb8\u53ef\u3002\n- `Samples/Rhino-Preview-Demo.3dm`\uff1a\u5e26\u4e2d\u6587\u5bf9\u8c61\u540d\u79f0\u3001\u5d4c\u5957\u56fe\u5c42\u3001\u9690\u85cf\u56fe\u5c42\u3001\u66f2\u7ebf\u7684 Rhino 8 \u683c\u5f0f\u6d4b\u8bd5\u6a21\u578b\u3002\n- `VALIDATION.md`\uff1a\u5df2\u5b8c\u6210\u7684\u9a8c\u8bc1\u548c\u672a\u9a8c\u8bc1\u7684\u90e8\u5206\u3002\n\n## v1.0.2 \u65b0\u589e\u5f69\u8272\u6a21\u5f0f\n\n- \u5de5\u5177\u680f\u65b0\u589e\u201c\u5f69\u8272\u201d\uff0c\u81ea\u52a8\u6309\u5bf9\u8c61\u5206\u914d\u4e0d\u540c\u7684\u989c\u8272\uff1b\u5feb\u6377\u952e `C` \u5728\u5f69\u8272/\u539f\u59cb\u95f4\u5207\u6362\u3002\n- \u7f51\u683c\u3001\u53ef\u8bfb\u53d6\u7684\u66f2\u9762/\u5b9e\u4f53\u3001\u66f2\u7ebf\u3001\u70b9\u4e91\u90fd\u53c2\u4e0e\u5206\u8272\u3002\u5bf9\u8c61\u5217\u8868\u7684\u8272\u5757\u4e0e\u5f69\u8272\u6a21\u5f0f\u4fdd\u6301\u4e00\u81f4\u3002\n- \u6839\u636e\u6a21\u578b\u5bf9\u8c61\u7684\u7a33\u5b9a\u6807\u8bc6\u5206\u914d\u914d\u8272\uff0c\u540c\u4e00\u6587\u4ef6\u6bcf\u6b21\u6253\u5f00\u914d\u8272\u4e00\u81f4\uff1b\u9690\u85cf\u3001\u72ec\u663e\u4e0d\u4f1a\u6539\u53d8\u914d\u8272\u3002\u7f16\u8f91\u6a21\u578b\u540e\u5bf9\u8c61\u589e\u5220\u53ef\u80fd\u4f7f\u914d\u8272\u53d8\u5316\u3002\n- \u5f69\u8272\u6a21\u5f0f\u4f7f\u7528\u9884\u89c8\u6750\u8d28\uff0c\u4e0d\u5199\u56de 3DM\uff1b\u5207\u56de\u201c\u539f\u59cb\u201d\u6062\u590d\u539f\u6750\u8d28/\u663e\u793a\u8272\u3002\n- \u5f69\u8272\u6a21\u5f0f\u53ef\u4ee5\u4e0e\u5256\u5207\u3001\u9009\u62e9\u548c\u663e\u9690\u914d\u5408\u4f7f\u7528\u3002\u5927\u91cf\u5bf9\u8c61\u7684\u989c\u8272\u53ef\u80fd\u8f83\u4e3a\u63a5\u8fd1\uff0c\u53ef\u914d\u5408\u5bf9\u8c61\u540d\u79f0\u3001\u9009\u62e9\u6846\u53ca\u72ec\u663e\u8fa8\u8ba4\u3002\n\n## v1.0.1 \u4fee\u590d\u5185\u5bb9\n\n- \u4fee\u590d `Failed to fetch`\uff1a\u4e0a\u4e00\u7248\u5c06\u6a21\u578b\u54cd\u5e94\u653e\u5728\u9759\u6001\u8d44\u6e90\u6620\u5c04\u7684\u540c\u4e00\u865a\u62df\u4e3b\u673a\u4e0b\uff0c\u4f46 WebView2 \u4e0d\u4f1a\u4e3a\u5df2\u6620\u5c04\u7684\u865a\u62df\u4e3b\u673a\u89e6\u53d1 `WebResourceRequested`\uff0c\u5bfc\u81f4\u6a21\u578b\u54cd\u5e94\u6ca1\u6709\u9001\u8fbe\u3002\n- \u6a21\u578b\u6539\u4e3a\u7531 QuickLook \u5bbf\u4e3b\u901a\u8fc7 WebMessage \u5206\u5757\u4f20\u8f93\uff1b\u6bcf\u5757 384 KB\uff0c\u5e76\u7531\u67e5\u770b\u5668\u786e\u8ba4\u540e\u518d\u4f20\u4e0b\u4e00\u5757\u3002\u6a21\u578b\u4e0d\u518d\u901a\u8fc7\u865a\u62df\u7f51\u5740\u8bfb\u53d6\uff0c\u4e5f\u4e0d\u66b4\u9732\u4efb\u610f\u672c\u5730\u8def\u5f84\u3002\n- \u5173\u95ed/\u5207\u6362\u6a21\u578b\u65f6\u53d6\u6d88\u672a\u5b8c\u6210\u7684\u4f20\u8f93\uff1b\u589e\u52a0\u5206\u5757\u987a\u5e8f\u3001\u5927\u5c0f\u3001\u5b8c\u6210\u6807\u8bb0\u548c\u8d85\u65f6\u68c0\u67e5\u3002\n- \u7ec6\u5316\u6a21\u578b\u4f20\u8f93\u4e0e\u89e3\u7801\u8d44\u6e90\u7684\u9519\u8bef\u63d0\u793a\uff0c\u5e76\u5728\u754c\u9762\u526f\u6807\u9898\u663e\u793a v1.0.1\u3002\n- \u7248\u672c\u5316\u9875\u9762\u53ca\u811a\u672c\u5730\u5740\uff0c\u907f\u514d\u5347\u7ea7\u540e\u7ee7\u7eed\u4f7f\u7528\u65e7\u7248\u9875\u9762\u8d44\u6e90\u3002\n\n\u5347\u7ea7\u65b9\u6cd5\uff1a\u89e3\u538b\u672c\u5305\uff0c\u4fdd\u6301 QuickLook \u8fd0\u884c\uff0c\u5728\u8d44\u6e90\u7ba1\u7406\u5668\u4e2d\u9009\u4e2d\u65b0\u7684 `.qlplugin` \u6309\u7a7a\u683c\uff0c\u70b9\u51fb\u5b89\u88c5/\u66f4\u65b0\uff0c\u7136\u540e**\u5b8c\u5168\u9000\u51fa\u5e76\u91cd\u65b0\u542f\u52a8 QuickLook**\u3002\u9884\u89c8\u7a97\u53e3\u5de6\u4e0a\u89d2\u526f\u6807\u9898\u5e94\u542b **v1.0.2**\u3002\n\n\u5fae\u8f6f\u5bf9\u865a\u62df\u4e3b\u673a\u6620\u5c04\u4e0e\u8d44\u6e90\u8bf7\u6c42\u4e8b\u4ef6\u7684\u8bf4\u660e\uff1a\nhttps://learn.microsoft.com/en-us/microsoft-edge/webview2/how-to/webresourcerequested\n\n## \u5b89\u88c5\n\n\u8fd0\u884c\u73af\u5883\uff1aWindows 10/11\u3001QuickLook\u3001.NET Framework 4.8 \u6216\u66f4\u9ad8\u7248\u672c\u3001Microsoft Edge WebView2 Evergreen Runtime\u3001\u652f\u6301 WebGL 2 \u7684\u663e\u5361/\u9a71\u52a8\u3002\u4e0d\u8981\u6c42\u5b89\u88c5 Rhino\uff0c\u4e5f\u4e0d\u8981\u6c42\u5b89\u88c5 Node.js\u3001.NET SDK \u6216\u5176\u4ed6\u5f00\u53d1\u5de5\u5177\u3002\n\n1. \u5c06\u672c\u538b\u7f29\u5305\u5b8c\u6574\u89e3\u538b\u3002\n2. \u542f\u52a8 QuickLook\uff0c\u786e\u8ba4\u7cfb\u7edf\u6258\u76d8\u6709\u5b83\u7684\u56fe\u6807\u3002\n3. \u5728**\u8d44\u6e90\u7ba1\u7406\u5668**\u4e2d\u9009\u4e2d `.qlplugin` \u6587\u4ef6\uff0c\u6309\u7a7a\u683c\u3002\n4. \u5728\u5f39\u51fa\u7684\u63d2\u4ef6\u5b89\u88c5\u7a97\u53e3\u4e2d\u70b9 `Install / \u5b89\u88c5`\u3002\n5. \u9000\u51fa\u5e76\u91cd\u65b0\u542f\u52a8 QuickLook\u3002\n6. \u5148\u9009\u4e2d `Samples/Rhino-Preview-Demo.3dm` \u6309\u7a7a\u683c\uff0c\u518d\u8bd5\u81ea\u5df1\u7684\u6a21\u578b\u3002\n\n\u5982\u679c\u63d0\u793a\u7f3a\u5c11 WebView2 Runtime\uff0c\u8bf7\u4f7f\u7528\u5fae\u8f6f\u5b98\u65b9\u4e0b\u8f7d\u9875\u9762\u5b89\u88c5 **Evergreen Runtime**\uff1a\nhttps://developer.microsoft.com/microsoft-edge/webview2/\n\n\u5982\u679c\u9009\u4e2d `.qlplugin` \u540e\u53ea\u663e\u793a\u538b\u7f29\u5305\u5185\u5bb9\uff0c\u8bf7\u786e\u8ba4\u6269\u5c55\u540d\u4ecd\u4e3a `.qlplugin`\uff0c\u5e76\u4f7f\u7528\u652f\u6301\u7b2c\u4e09\u65b9\u63d2\u4ef6\u7684 QuickLook \u53d1\u884c\u7248\u3002\u4e0d\u8981\u628a\u5305\u5185\u7684 DLL \u5355\u72ec\u590d\u5236\u51fa\u6765\uff1bAssets \u548c runtimes \u76ee\u5f55\u4e5f\u662f\u5fc5\u9700\u7684\u3002\n\n\u817e\u8baf\u684c\u9762\u6574\u7406\u4e0e QuickLook \u7684\u684c\u9762\u89e6\u53d1\u517c\u5bb9\u95ee\u9898\u662f\u72ec\u7acb\u95ee\u9898\u3002\u672c\u63d2\u4ef6\u6269\u5c55\u7684\u662f 3DM \u8bfb\u53d6\u548c\u663e\u793a\u80fd\u529b\uff0c\u4e0d\u6539\u53d8 QuickLook \u5982\u4f55\u53d6\u5f97\u684c\u9762\u9009\u4e2d\u6587\u4ef6\u3002\u5b89\u88c5\u548c\u9996\u6b21\u6d4b\u8bd5\u8bf7\u5728\u8d44\u6e90\u7ba1\u7406\u5668\u4e2d\u8fdb\u884c\u3002\n\n## \u529f\u80fd\n\n- \u672c\u5730\u3001\u53ea\u8bfb\u3001\u79bb\u7ebf\u8bfb\u53d6 3DM\uff0c\u8fd0\u884c\u65f6\u4e0d\u4ece CDN \u4e0b\u8f7d\u811a\u672c\u548c WASM\uff0c\u4e5f\u4e0d\u4e0a\u4f20\u6a21\u578b\u3002\n- \u7f51\u683c\u3001\u66f2\u7ebf\u3001\u70b9/\u70b9\u4e91\uff0c\u4ee5\u53ca\u5177\u6709\u5df2\u4fdd\u5b58\u663e\u793a\u7f51\u683c\u7684 Brep \u66f2\u9762/\u591a\u91cd\u66f2\u9762/\u5b9e\u4f53\u3001Extrusion\u3002\n- \u8bfb\u53d6\u7ec4\u4ef6\u5305\u542b SubD \u548c\u57fa\u7840\u5757\u5b9e\u4f8b\u5904\u7406\uff1bSubD\u3001\u590d\u6742\u5d4c\u5957\u5757\u3001\u94fe\u63a5\u5757\u5c1a\u672a\u7528\u7528\u6237\u6837\u672c\u9a8c\u8bc1\u3002\n- \u539f\u59cb\u57fa\u7840\u6750\u8d28/\u5bf9\u8c61\u663e\u793a\u8272\u3001\u7edf\u4e00\u7070\u6a21\u3001\u7ebf\u6846\u3001\u81ea\u52a8\u6309\u5bf9\u8c61\u5206\u8272\u6a21\u5f0f\u3002\n- \u9f20\u6807\u65cb\u8f6c\u3001\u5e73\u79fb\u3001\u7f29\u653e\u3001\u53cc\u51fb\u805a\u7126\uff1b\u7b49\u8f74\u3001\u524d\u3001\u53f3\u3001\u9876\u89c6\u56fe\uff1b\u6b63\u4ea4/\u900f\u89c6\u5207\u6362\u3002\n- \u56fe\u5c42\u4e0e\u5bf9\u8c61\u5217\u8868\u3001\u641c\u7d22\u3001\u663e\u9690\u3001\u7236\u5b50\u56fe\u5c42\u663e\u9690\u7ee7\u627f\u3001\u5bf9\u8c61\u9009\u62e9\u3001\u72ec\u663e\u3001\u6062\u590d\u539f\u59cb\u663e\u9690\u3002\n- \u6a21\u578b\u5355\u4f4d\u3001\u5df2\u663e\u793a\u7f51\u683c\u4e09\u89d2\u9762\u6570\u91cf\u3001\u53ef\u9884\u89c8\u5bf9\u8c61\u6570\u91cf\u3001\u521d\u59cb\u53ef\u89c1\u6a21\u578b\u53ca\u9009\u4e2d\u5bf9\u8c61\u5305\u56f4\u76d2\u5c3a\u5bf8\u3002\n- X/Y/Z \u8f74\u52a8\u6001\u5256\u5207\u3002**\u5207\u9762\u4e0d\u5c01\u53e3**\uff0c\u4e0d\u5c5e\u4e8e\u7cbe\u786e\u7684\u5b9e\u4f53\u622a\u9762\u5206\u6790\u3002\n- \u6df1\u6d45\u80cc\u666f\u3001\u5730\u9762\u7f51\u683c\u5f00\u5173\u3001\u9519\u8bef\u548c\u7f3a\u5c11\u663e\u793a\u7f51\u683c\u63d0\u793a\u3002\n- \u7528\u6237\u5173\u95ed\u9884\u89c8\u65f6\u91ca\u653e\u67e5\u770b\u5668\u3001\u5de5\u4f5c\u7ebf\u7a0b\u3001\u6a21\u578b\u548c\u6e32\u67d3\u8d44\u6e90\u3002\n\n## \u64cd\u4f5c\n\n| \u64cd\u