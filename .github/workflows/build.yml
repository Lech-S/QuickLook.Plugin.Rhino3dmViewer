 Thickness(32),\n                HorizontalAlignment = HorizontalAlignment.Center,\n                VerticalAlignment = VerticalAlignment.Center\n            };\n            Children.Add(status);\n            startupWatchdog.Interval = TimeSpan.FromSeconds(40);\n            startupWatchdog.Tick += (s, e) => {\n                startupWatchdog.Stop();\n                ShowError(\"\u9884\u89c8\u7ec4\u4ef6\u542f\u52a8\u8d85\u65f6\u3002\u8bf7\u5173\u95ed\u7a97\u53e3\u540e\u91cd\u8bd5\uff0c\u5e76\u786e\u8ba4 WebView2 Runtime \u53ef\u6b63\u5e38\u8fd0\u884c\u3002\\n\u82e5\u5b89\u88c5\u4e86\u5176\u4ed6\u4f7f\u7528 WebView2 \u7684\u63d2\u4ef6\uff0c\u4e5f\u8bf7\u5c1d\u8bd5\u66f4\u65b0\u5b83\u4eec\u3002\");\n            };\n            Loaded += OnLoaded;\n        }\n\n        private static Task<CoreWebView2Environment> GetEnvironment()\n        {\n            lock (EnvironmentLock)\n            {\n                if (sharedEnvironment == null || sharedEnvironment.IsFaulted || sharedEnvironment.IsCanceled)\n                {\n                    string profile = Path.Combine(Environment.GetFolderPath(\n                        Environment.SpecialFolder.LocalApplicationData), \"QuickLook\", \"Rhino3dmViewer\", \"WebView2\");\n                    sharedEnvironment = CoreWebView2Environment.CreateAsync(null, profile, null);\n                }\n                return sharedEnvironment;\n            }\n        }\n\n        private static void PreloadNativeLoader(string directory)\n        {\n            if (loaderHandle != IntPtr.Zero) return;\n            string architecture = Environment.GetEnvironmentVariable(\"PROCESSOR_ARCHITECTURE\") ?? \"\";\n            string rid = !Environment.Is64BitProcess ? \"win-x86\" :\n                architecture.Equals(\"ARM64\", StringComparison.OrdinalIgnoreCase) ? \"win-arm64\" : \"win-x64\";\n            string loader = Path.Combine(directory, \"runtimes\", rid, \"native\", \"WebView2Loader.dll\");\n            if (!File.Exists(loader)) throw new FileNotFoundException(\"\u63d2\u4ef6\u7f3a\u5c11 WebView2Loader.dll\uff0c\u8bf7\u91cd\u65b0\u5b89\u88c5\u5b8c\u6574\u63d2\u4ef6\u5305\u3002\", loader);\n            loaderHandle = LoadLibraryEx(loader, IntPtr.Zero, 0x00000008);\n            if (loaderHandle == IntPtr.Zero)\n                throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error(), \"\u65e0\u6cd5\u8f7d\u5165 WebView2 \u7ec4\u4ef6\uff08\" + rid + \"\uff09\u3002\");\n        }\n\n        private async void OnLoaded(object sender, RoutedEventArgs e)\n        {\n            if (started || disposed) return;\n            started = true;\n            startupWatchdog.Start();\n            try\n            {\n                var file = new FileInfo(path);\n                if (!file.Exists) throw new FileNotFoundException(\"\u6a21\u578b\u4e0d\u5b58\u5728\u6216\u5df2\u88ab\u79fb\u52a8\u3002\");\n                if (file.Length > MaxFileBytes) throw new IOException(\"\u672c\u7248\u652f\u6301\u6700\u5927 512 MB \u7684 3DM \u6587\u4ef6\uff0c\u8bf7\u5148\u5728 Rhino \u4e2d\u62c6\u5206\u6216\u7cbe\u7b80\u6a21\u578b\u3002\");\n                using (var f = new FileStream(path, FileMode.Open, FileAccess.Read, FileShare.ReadWrite | FileShare.Delete))\n                {\n                    byte[] bytes = new byte[32];\n                    int count = f.Read(bytes, 0, bytes.Length);\n                    if (count < 24 || !Encoding.ASCII.GetString(bytes, 0, count).StartsWith(\"3D Geometry File Format\", StringComparison.Ordinal))\n                        throw new InvalidDataException(\"\u6587\u4ef6\u6ca1\u6709\u6709\u6548\u7684 Rhino 3DM \u6587\u4ef6\u5934\uff0c\u53ef\u80fd\u5df2\u635f\u574f\u6216\u53ea\u662f\u6539\u4e86\u6269\u5c55\u540d\u3002\");\n                }\n                string directory = Path.GetDirectoryName(Assembly.GetExecutingAssembly().Location);\n                string assets = Path.Combine(directory, \"Assets\");\n                if (!File.Exists(Path.Combine(assets, \"viewer.html\")))\n                    throw new FileNotFoundException(\"\u63d2\u4ef6\u8d44\u6e90\u4e0d\u5b8c\u6574\uff0c\u8bf7\u91cd\u65b0\u5b89\u88c5 .qlplugin \u6587\u4ef6\u3002\");\n                PreloadNativeLoader(directory);\n                var environment = await GetEnvironment();\n                if (disposed) return;\n                web = new WebView2 { DefaultBackgroundColor = System.Drawing.Color.FromArgb(22, 27, 35) };\n                Children.Insert(0, web);\n                await web.EnsureCoreWebView2Async(environment);\n                if (disposed) return;\n                var core = web.CoreWebView2;\n                core.Settings.AreDefaultContextMenusEnabled = false;\n                core.Settings.AreDevToolsEnabled = false;\n                core.Settings.IsStatusBarEnabled = false;\n                core.Settings.IsZoomControlEnabled = false;\n                core.Settings.AreBrowserAcceleratorKeysEnabled = false;\n                core.SetVirtualHostNameToFolderMapping(Host, assets, CoreWebView2HostResourceAccessKind.DenyCors);\n                core.AddWebResourceRequestedFilter(\"*\", CoreWebView2WebResourceContext.All);\n                core.WebResourceRequested += OnResourceRequested;\n                core.WebMessageReceived += OnMessage;\n                core.NavigationStarting += OnNavigationStarting;\n                core.NewWindowRequested += OnNewWindow;\n                core.PermissionRequested += OnPermission;\n                core.DownloadStarting += OnDownload;\n                core.ProcessFailed += OnProcessFailed;\n                core.NavigationCompleted += OnNavigationCompleted;\n                core.Navigate(Origin + \"/viewer.html?v=1.0.2\");\n            }\n            catch (Exception ex)\n            {\n                if (!disposed) ShowError(ex is WebView2RuntimeNotFoundException\n                    ? \"\u672a\u68c0\u6d4b\u5230 Microsoft Edge WebView2 Runtime\u3002\\n\u8bf7\u5b89\u88c5\u5fae\u8f6f\u5b98\u65b9\u7684 Evergreen WebView2 Runtime\uff0c\u91cd\u542f QuickLook \u540e\u518d\u8bd5\u3002\\n\u4e0b\u8f7d\u5730\u5740\uff1ahttps://developer.microsoft.com/microsoft-edge/webview2/\"\n                    : \"3DM \u9884\u89c8\u672a\u80fd\u542f\u52a8\uff1a\\n\" + ex.Message);\n                Log(ex);\n            }\n        }\n\n        private void OnResourceRequested(object sender, CoreWebView2WebResourceRequestedEventArgs e)\n        {\n            if (disposed) return;\n            Uri uri;\n            if (!Uri.TryCreate(e.Request.Uri, UriKind.Absolute, out uri)) return;\n            var core = web.CoreWebView2;\n            if (uri.Scheme == \"https\" && uri.Host == Host)\n            {\n                // Static assets only. Requests to a mapped virtual host do not raise this\n                // event; model bytes therefore travel through the WebMessage channel.\n                return;\n            }\n            if (uri.Scheme == \"data\" || uri.Scheme == \"blob\") return;\n            e.Response = core.Environment.CreateWebResourceResponse(null, 403, \"External requests disabled\", \"\");\n        }\n\n        private async void OnMessage(object sender, CoreWebView2WebMessageReceivedEventArgs e)\n        {\n            if (disposed || !e.Source.StartsWith(Origin + \"/viewer.html\", StringComparison.Ordinal)) return;\n            try\n            {\n                var message = json.Deserialize<Dictionary<string, object>>(e.WebMessageAsJson);\n                object type;\n                if (message == null || !message.TryGetValue(\"type\", out type)) return;\n                switch (Convert.ToString(type))\n                {\n                    case \"ready\":\n                        startupWatchdog.Stop();\n                        status.Visibility = Visibility.Collapsed;\n                        web.CoreWebView2.PostWebMessageAsJson(json.Serialize(new {\n                            type = \"load\", transport = \"host-chunks\", modelToken = token,\n                            filename = Path.GetFileName(path), bytes = new FileInfo(path).Length\n                        }));\n                        break;\n                    case \"modelChunkRequest\":\n                        object requestedToken, requestedId, requestedOffset;\n                        if (!message.TryGetValue(\"modelToken\", out requestedToken) || Convert.ToString(requestedToken) != token\n                            || !message.TryGetValue(\"transferId\", out requestedId)\n                            || !message.TryGetValue(\"offset\", out requestedOffset)) return;\n                        string transferId = Convert.ToString(requestedId);\n                        if (String.IsNullOrEmpty(transferId) || transferId.Length > 128) return;\n                        long offset = Convert.ToInt64(requestedOffset);\n                        await SendModelChunkAsync(transferId, offset);\n                        break;\n                    case \"cancelModelTransfer\":\n                        object cancelledId;\n                        if (message.TryGetValue(\"transferId\", out cancelledId) && modelTransfer != null\n                            && modelTransfer.Id == Convert.ToString(cancelledId)) CancelModelTransfer();\n                        break;\n                    case \"error\":\n                        object error;\n                        if (message.TryGetValue(\"message\", out error))\n                            Log(new IOException(\"Viewer: \" + Convert.ToString(error)));\n                        break;\n                    case \"modelLoaded\": status.Visibility = Visibility.Collapsed; break;\n                    case \"close\": SendQuickLookCommand(\"Close\"); break;\n                    case \"fullscreen\": SendQuickLookCommand(\"Fullscreen\"); break;\n                }\n            }\n            catch (Exception ex) { Log(ex); }\n        }\n\n        private async Task SendModelChunkAsync(string transferId, long offset)\n        {\n            ModelTransfer current = null;\n            try\n            {\n                if (offset == 0)\n                {\n                    CancelModelTransfer();\n                    modelTransfer = new ModelTransfer(path, transferId);\n                }\n                current = modelTransfer;\n                if (current == null || current.Id != transferId) return;\n                ModelChunk chunk = await current.ReadNextAsync(offset);\n                if (disposed || modelTransfer != current || web == null || web.CoreWebView2 == null) return;\n                web.CoreWebView2.PostWebMessageAsJson(json.Serialize(chunk));\n                if (chunk.done) CancelModelTransfer();\n            }\n            catch (Exception ex)\n            {\n                if (disposed || (current != null && modelTransfer != current)) return;\n                Log(ex);\n                if (web != null && web.CoreWebView2 != null)\n                    web.CoreWebView2.PostWebMessageAsJson(json.Serialize(new {\n                        type = \"modelTransferError\", transferId = transferId,\n                        message = \"\u6a21\u578b\u6587\u4ef6\u8bfb\u53d6\u5931\u8d25\uff1a\" + ex.Message\n                    }));\n                CancelModelTransfer();\n            }\n        }\n\n        private void CancelModelTransfer()\n        {\n            var current = modelTransfer;\n            modelTransfer = null;\n            if (current != null) current.Dispose();\n        }\n\n        private static void SendQuickLookCommand(string command)\n        {\n            Task.Run(() => {\n                try\n                {\n                    using (var pipe = new NamedPipeClientStream(\".\", \"QuickLook.App.Pipe.\" + WindowsIdentity.GetCurrent().User.Value, PipeDirection.Out))\n                    {\n                        pipe.Connect(600);\n                        using (var writer = new StreamWriter(pipe, new UTF8Encoding(false)))\n                            writer.WriteLine(\"QuickLook.App.PipeMessages.\" + command + \"||\");\n                    }\n                }\n                catch (Exception ex) { Log(ex); }\n            });\n        }\n\n        private void OnNavigationStarting(object sender, CoreWebView2NavigationStartingEventArgs e)\n        { if (!e.Uri.StartsWith(Origin + \"/viewer.html\", StringComparison.Ordinal)) e.Cancel = true; }\n        private void OnNewWindow(object sender, CoreWebView2NewWindowRequestedEventArgs e) { e.Handled = true; }\n        private void OnPermission(object sender, CoreWebView2PermissionRequestedEventArgs e) { e.State = CoreWebView2PermissionState.Deny; }\n        private void OnDownload(object sender, CoreWebView2DownloadStartingEventArgs e) { e.Cancel = true; }\n        private void OnProcessFailed(object sender, CoreWebView2ProcessFailedEventArgs e)\n        { ShowError(\"WebView2 \u6e32\u67d3\u8fdb\u7a0b\u5df2\u505c\u6b62\u3002\u8bf7\u5173\u95ed\u9884\u89c8\u540e\u91cd\u65b0\u6309\u7a7a\u683c\uff1b\u5982\u679c\u53cd\u590d\u53d1\u751f\uff0c\u8bf7\u66f4\u65b0\u663e\u5361\u9a71\u52a8\u53ca WebView2 Runtime\u3002\"); }\n        private void OnNavigationCompleted(object sender, CoreWebView2NavigationCompletedEventArgs e)\n        { if (!e.IsSuccess && !disposed) ShowError(\"\u9884\u89c8\u9875\u9762\u52a0\u8f7d\u5931\u8d25\uff1a\" + e.WebErrorStatus + \"\u3002\u8bf7\u91cd\u65b0\u5b89\u88c5\u5b8c\u6574\u63d2\u4ef6\u5305\u3002\"); }\n\n        private void ShowError(string text)\n        {\n            if (disposed) return;\n            startupWatchdog.Stop();\n            status.Text = text;\n            status.Visibility = Visibility.Visible;\n            if (web != null) web.Visibility = Visibility.Collapsed;\n        }\n\n        internal static void Log(Exception ex)\n        {\n            try {\n                string folder = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), \"QuickLook\", \"Rhino3dmViewer\");\n                Directory.CreateDirectory(folder);\n                string log = Path.Combine(folder, \"viewer.log\");\n                if (File.Exists(log) && new FileInfo(log).Length > 131072) File.WriteAllText(log, \"\");\n                File.AppendAllText(log, DateTime.Now.ToString(\"s\") + \" \" + ex.GetType().Name + \": \" + ex.Message + Environment.NewLine);\n            } catch { }\n        }\n\n        public void Dispose()\n        {\n            if (disposed) return;\n            disposed = true;\n            startupWatchdog.Stop();\n            CancelModelTransfer();\n            Loaded -= OnLoaded;\n            if (web != null)\n            {\n                try {\n                    if (web.CoreWebView2 != null) {\n                        web.CoreWebView2.WebResourceRequested -= OnResourceRequested;\n                        web.CoreWebView2.WebMessageReceived -= OnMessage;\n                        web.CoreWebView2.NavigationStarting -= OnNavigationStarting;\n                        web.CoreWebView2.NewWindowRequested -= OnNewWindow;\n                        web.CoreWebView2.PermissionRequested -= OnPermission;\n                        web.CoreWebView2.DownloadStarting -= OnDownload;\n                        web.CoreWebView2.ProcessFailed -= OnProcessFailed;\n                        web.CoreWebView2.NavigationCompleted -= OnNavigationCompleted;\n                    }\n                    web.Dispose();\n                } catch (Exception ex) { Log(ex); }\n                web = null;\n            }\n            Children.Clear();\n        }\n\n        [DllImport(\"kernel32.dll\", CharSet = CharSet.Unicode, SetLastError = true)]\n        private static extern IntPtr LoadLibraryEx(string fileName, IntPtr reserved, uint flags);\n    }\n}\n", "VALIDATION.md": "# v1.0.2 \u9a8c\u8bc1\u8bb0\u5f55\n\n## \u5df2\u5b8c\u6210\n\n- \u4f7f\u7528 .NET 8 Roslyn \u7f16\u8bd1\u5668\u3001.NET Framework 4.8 \u53c2\u8003\u7a0b\u5e8f\u96c6\u3001\u5b9e\u9645 QuickLook.Common.dll \u548c WebView2 \u7a0b\u5e8f\u96c6\u7f16\u8bd1 C# \u63d2\u4ef6\uff1a\u901a\u8fc7\uff0c\u65e0\u7f16\u8bd1\u8b66\u544a\u3002\n- \u5728 Chromium 134 \u65e0\u5934\u6d4f\u89c8\u5668\u4e2d\u5b9e\u9645\u8fd0\u884c\u6253\u5305\u540e\u7684\u7f51\u9875\u3001rhino3dm WASM \u548c Three.js\uff1b\u4f7f\u7528\u8f6f\u4ef6 WebGL \u6e32\u67d3\u3002\n- 16 \u9879\u6d4f\u89c8\u5668\u9a8c\u8bc1\u901a\u8fc7\uff1aRhino 8 \u6e32\u67d3\u4e0e\u4ea4\u4e92\uff1bRhino 5/6/7 \u6587\u4ef6\u5206\u522b\u8bfb\u53d6\uff1bMcNeel mesh/blocks/file3dm_stuff \u5b98\u65b9\u6837\u4f8b\u5206\u522b\u8bfb\u53d6\uff1b\u7a7a\u6587\u4ef6/\u4f2a\u9020\u6269\u5c55\u540d\u6587\u4ef6/\u7f3a\u5c11\u663e\u793a\u7f51\u683c\u6587\u4ef6\u5206\u522b\u5c55\u793a\u9519\u8bef\uff1b\u6d4f\u89c8\u5668\u65e0\u672a\u5904\u7406\u5f02\u5e38\u4e14\u6ca1\u6709\u5916\u90e8\u7f51\u7edc\u8bf7\u6c42\u3002\n- \u4ea4\u4e92\u9a8c\u8bc1\u5305\u542b\uff1a\u4e2d\u6587\u5bf9\u8c61\u540d\u3001\u5bf9\u8c61\u663e\u793a\u8272\u3001\u56fe\u5c42\u539f\u59cb\u663e\u9690\u3001\u7236\u56fe\u5c42\u5bf9\u540e\u4ee3\u5bf9\u8c61\u7684\u663e\u9690\u3001\u7ebf\u6846\u3001\u6b63\u4ea4\u6295\u5f71\u3001\u5256\u5207\u3001\u5256\u5207\u540e\u5207\u6362\u663e\u793a\u6a21\u5f0f\u3001\u5168\u663e\u3001\u6062\u590d\u3001\u9009\u62e9\u3001\u72ec\u663e\u3002\n- \u5b98\u65b9\u6837\u4f8b\u4e2d\u6709\u4e0d\u5e26\u663e\u793a\u7f51\u683c\u7684 Brep/Extrusion\uff0c\u6d4b\u8bd5\u786e\u8ba4\u4ecd\u663e\u793a\u53ef\u8bfb\u53d6\u5bf9\u8c61\uff0c\u5e76\u63d0\u793a\u7f3a\u5c11\u7f51\u683c\u3002\u6ca1\u6709\u628a\u90e8\u5206\u8bfb\u53d6\u5f53\u4f5c\u5b8c\u6574\u8fd8\u539f\u3002\n- \u6d4b\u8bd5\u4f7f\u7528\u4e86\u8fde\u7eed\u591a\u6b21\u6362\u6a21\u578b\u548c\u9519\u8bef\u540e\u91cd\u65b0\u8bfb\u53d6\uff0c\u672a\u51fa\u73b0\u672a\u5904\u7406\u7684\u9875\u9762\u5f02\u5e38\u3002\n\n## v1.0.1 \u65b0\u589e\u56de\u5f52\u9a8c\u8bc1\n\n- C# \u5206\u5757\u8bfb\u53d6\u7c7b\u5b9e\u9645\u6267\u884c 17 \u6761\u65ad\u8a00\uff1a\u591a\u5206\u5757\u91cd\u7ec4\u540e\u7684\u6570\u636e\u9010\u5b57\u8282\u4e00\u81f4\u3001\u4e2d\u6587\u53ca\u7a7a\u683c\u8def\u5f84\u3001\u5206\u5757\u5927\u5c0f\u9650\u5236\u3001\u5b8c\u6210\u6807\u8bb0\u3001\u5f02\u5e38\u987a\u5e8f\u3001\u53d6\u6d88\u540e\u8bfb\u53d6\u3001\u6587\u4ef6\u4e0d\u5b58\u5728\u3001\u7a7a\u6587\u4ef6\u3002\n- \u6d4f\u89c8\u5668\u6a21\u62df WebView2 \u7684\u6d88\u606f\u901a\u9053\uff0c\u5f3a\u5236\u963b\u65ad\u6240\u6709 `.3dm` \u7f51\u5740\u8bf7\u6c42\uff1a11 KB \u4e0e 4 MB \u6a21\u578b\u5206\u522b\u901a\u8fc7 1 \u4e2a\u53ca 11 \u4e2a\u5bbf\u4e3b\u5206\u5757\u6210\u529f\u8f7d\u5165\uff1b\u6ca1\u6709\u53d1\u8d77\u6a21\u578b\u7f51\u5740\u8bf7\u6c42\u3002\n- \u6a21\u62df\u5bbf\u4e3b\u8bfb\u53d6\u5931\u8d25\uff0c\u786e\u8ba4\u663e\u793a\u5177\u4f53\u9519\u8bef\uff1b\u968f\u540e\u91cd\u8bd5\u80fd\u591f\u6b63\u5e38\u8f7d\u5165\u3002\n- C# \u8bfb\u53d6\u903b\u8f91\u5728 .NET 8 \u4e0a\u5b9e\u9645\u6267\u884c\u9a8c\u8bc1\uff1b\u4ea4\u4ed8\u63d2\u4ef6\u53e6\u4ee5 .NET Framework 4.8 \u53c2\u8003\u7a0b\u5e8f\u96c6\u7f16\u8bd1\u901a\u8fc7\u3002\n\n## v1.0.2 \u65b0\u589e\u9a8c\u8bc1\n\n- \u4e0d\u540c\u7f51\u683c\u548c\u66f2\u7ebf\u83b7\u5f97\u4e0d\u540c\u989c\u8272\uff1b\u540c\u4e00\u6587\u4ef6\u91cd\u65b0\u8bfb\u53d6\u540e\u7684\u914d\u8272\u4fdd\u6301\u4e00\u81f4\u3002\n- \u5207\u56de\u539f\u59cb\u6a21\u5f0f\u540e\uff0c\u7f51\u683c\u663e\u793a\u8272\u3001\u66f2\u7ebf\u548c\u70b9\u4e91\u6750\u8d28\u5747\u6062\u590d\uff1b\u6e90\u6750\u8d28\u672a\u88ab\u5f69\u8272\u6a21\u5f0f\u6539\u5199\u3002\n- \u9a8c\u8bc1\u5f69\u8272\u6a21\u5f0f\u7684 `C` \u5feb\u6377\u952e\u3001\u5bf9\u8c61\u5217\u8868\u8272\u5757\u3001\u4e0e\u5256\u5207\u7684\u914d\u5408\u3002\n- \u5728 McNeel \u7684\u6df7\u5408\u7c7b\u578b\u6837\u4f8b\u4e2d\u9a8c\u8bc1\u7f51\u683c/\u66f2\u7ebf/\u70b9\u4e91\u5206\u8272\u53ca\u539f\u59cb\u6750\u8d28\u6062\u590d\u3002\n\n## \u5c1a\u672a\u9a8c\u8bc1\n\n- \u5f53\u524d\u6267\u884c\u73af\u5883\u4e0d\u662f Windows\uff1a\u672a\u5728\u771f\u5b9e QuickLook \u8fdb\u7a0b\u4e2d\u8fdb\u884c\u63d2\u4ef6\u5b89\u88c5\u3001WPF/WebView2 \u5d4c\u5165\u3001\u7a7a\u683c/Esc \u5173\u95ed\u53ca F11 \u5168\u5c4f\u7684\u7aef\u5230\u7aef\u5b9e\u673a\u6d4b\u8bd5\u3002\n- .NET SDK \u7684\u5b8c\u6574 MSBuild \u547d\u4ee4\u5728\u5f53\u524d\u6267\u884c\u73af\u5883\u56e0\u8fdb\u7a0b\u4fe1\u606f\u63a5\u53e3\u4e0d\u53ef\u7528\u800c\u672a\u8fd0\u884c\uff1b\u4ea4\u4ed8 DLL \u4f7f\u7528\u4e0a\u8ff0 Roslyn \u76f4\u63a5\u7f16\u8bd1\u8def\u5f84\u6784\u5efa\u3002Windows \u6784\u5efa\u811a\u672c\u548c\u9879\u76ee\u6587\u4ef6\u5df2\u63d0\u4f9b\uff0c\u4ecd\u9700\u5728 Windows \u4e0a\u590d\u6838\u3002\n- \u672a\u5b9e\u673a\u9a8c\u8bc1 x86/ARM64\u3001\u5546\u5e97\u7248\u3001\u4e0e\u5176\u4ed6 WebView2 \u63d2\u4ef6\u5171\u5b58\u3001\u817e\u8baf\u684c\u9762\u6574\u7406\u5185\u89e6\u53d1\u3001\u5927\u4e8e\u6837\u4f8b\u89c4\u6a21\u7684\u751f\u4ea7\u88c5\u914d\u3001Rhino 9\u3001\u94fe\u63a5\u5757\u3001\u590d\u6742\u5d4c\u5957\u5757\u3001\u5168\u90e8\u6750\u8d28\u548c SubD \u6587\u4ef6\u3002\n- \u672c\u6b21\u6ca1\u6709\u53d6\u5f97\u7528\u6237\u7684\u5b9e\u9645 3DM \u6587\u4ef6\uff0c\u6700\u7ec8\u517c\u5bb9\u6027\u9700\u8981\u7528\u6237\u6837\u672c\u9a8c\u8bc1\u3002\n\n## \u4f7f\u7528\u7684\u6837\u4f8b\n\n- \u81ea\u884c\u751f\u6210\uff1a3 \u4e2a\u7f51\u683c\u30011 \u6761 NURBS \u5706\u30013 \u4e2a\u56fe\u5c42\uff08\u542b\u5b50\u56fe\u5c42\u548c\u9690\u85cf\u56fe\u5c42\uff09\uff0c\u5206\u522b\u4fdd\u5b58 Rhino 5/6/7/8 \u683c\u5f0f\u3002\n- \u81ea\u884c\u751f\u6210\uff1a\u7a7a 3DM\u3001\u6ca1\u6709\u663e\u793a\u7f51\u683c\u7684\u7403\u4f53 Brep\u3001\u65e0\u6548\u6587\u4ef6\u5934\u3002\n- McNeel \u5b98\u65b9 rhino3dm \u4ed3\u5e93\uff1a`tests/models/mesh.3dm`\u3001`blocks.3dm`\u3001`file3dm_stuff.3dm`\u3002\u8fd9\u4e9b\u7b2c\u4e09\u65b9\u6837\u4f8b\u4ec5\u7528\u4e8e\u6d4b\u8bd5\uff0c\u6ca1\u6709\u653e\u5165\u4ea4\u4ed8\u5305\u3002\n", "build-plugin.ps1": "param([switch]$RebuildWeb)\n$ErrorActionPreference = 'Stop'\nSet-Location $PSScriptRoot\nif ($RebuildWeb) {\n    npm ci\n    if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }\n    npm run build:web\n    if ($LASTEXITCODE -ne 0) { throw 'Web build failed' }\n}\ndotnet build .\\QuickLook.Plugin.Rhino3dmViewer.csproj -c Release\nif ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }\n$output = Join-Path $PSScriptRoot 'bin\\Release\\net48'\n$stage = Join-Path $PSScriptRoot 'dist\\Rhino3dmViewer'\nif (Test-Path $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }\nNew-Item -ItemType Directory -Path $stage -Force | Out-Null\nforeach ($name in @('QuickLook.Plugin.Rhino3dmViewer.dll','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.Wpf.dll','QuickLook.Plugin.Metadata.config','Assets','runtimes','LICENSES')) {\n    Copy-Item -LiteralPath (Join-Path $output $name) -Destination $stage -Recurse\n}\n$version = ([xml](Get-Content -LiteralPath (Join-Path $PSScriptRoot 'QuickLook.Plugin.Metadata.config') -Raw)).Metadata.Version\n$zip = Join-Path $PSScriptRoot ('dist\\QuickLook.Plugin.Rhino3dmViewer_v' + $version + '.zip')\nCompress-Archive -Path \"$stage\\*\" -DestinationPath $zip -Force\n$plugin = [IO.Path]::ChangeExtension($zip, '.qlplugin')\nMove-Item -LiteralPath $zip -Destination $plugin -Force\nWrite-Host \"Created $plugin\"\n", "build-web.cjs": "const path = require('path');\nconst fs = require('fs');\nrequire('esbuild').buildSync({\n  entryPoints: [path.join(__dirname, 'Assets/viewer.js')],\n  bundle: true, format: 'esm', target: 'chrome120', minify: true,\n  legalComments: 'eof', outfile: path.join(__dirname, 'Assets/viewer.bundle.js')\n});\nconst destination = path.join(__dirname, 'Assets/rhino');\nfs.mkdirSync(destination, { recursive: true });\nfor (const file of ['rhino3dm.js', 'rhino3dm.wasm'])\n  fs.copyFileSync(require.resolve('rhino3dm/' + file), path.join(destination, file));\nconsole.log('Offline web assets rebuilt.');\n", "docs/RELEASE-NOTES.md": "Rhino 3DM previews for QuickLook on Windows.\n\nThis is a **preview/beta release**, not a claim of complete Rhino compatibility.\n\nFeatures:\n- Offline, read-only `.3dm` previews.\n- Original, clay, wireframe and automatic per-object colors.\n- Layers/objects, visibility, isolation, standard views and uncapped section planes.\n- Host-to-viewer chunked model transfer; the model is not uploaded.\n\nInstallation: select the attached `.qlplugin` while QuickLook is running, press Space, install, then fully restart QuickLook.\n\nImportant limitations: Breps/extrusions need saved display meshes; renderer-specific materials and external linked resources are not reproduced. The current UI is Simplified Chinese. Full Windows QuickLook integration, all architectures and production-size assemblies still need validation.\n\nThe source includes validation records and third-party license notices. This plugin is independent of McNeel, Microsoft and the QuickLook maintainers.\n", "docs/UPSTREAM-SUBMISSION.md": "# Draft: Plugin listing request \u2014 Rhino3dmViewer (.3dm)\n\n**Prepare only. Do not post until the repository and release links below have been resolved and verified.**\n\nSuggested issue/discussion title:\n\n`Plugin listing request: Rhino3dmViewer for Rhino .3dm files`\n\nSuggested body:\n\nHello QuickLook maintainers,\n\nI would like to propose Rhino3dmViewer for the Available Plugins list.\n\n- Repository: `https://github.com/Lech-S/QuickLook.Plugin.Rhino3dmViewer`\n- Release: `https://github.com/Lech-S/QuickLook.Plugin.Rhino3dmViewer/releases/tag/v1.0.2`\n- Package: `QuickLook.Plugin.Rhino3dmViewer_v1.0.2.qlplugin`\n- License: GPL-3.0-or-later for the plugin; third-party components retain their own licenses.\n\nThe plugin adds offline, read-only Rhino `.3dm` previews using rhino3dm, Three.js and WebView2. It supports original/clay/wireframe/automatic object colors, layer and object visibility, isolation, orbit/pan/zoom, standard views and uncapped section planes. The integration approach was informed by StepViewer.\n\nThis is a preview/beta. Browser rendering and host binary-transfer tests pass; the Windows QuickLook integration and all architectures have not been fully validated. Breps/extrusions require display meshes saved in the 3DM file, and the current UI is Simplified Chinese. These limitations are documented prominently.\n\nWould you be willing to list it as a third-party preview plugin, or advise if more Windows validation is required first? This request is for the external plugin list; it does not ask for immediate inclusion in the built-in viewers.\n\nThank you.\n\n## Proposed Wiki table row\n\n```markdown\n| [Rhino3dmViewer](https://github.com/Lech-S/QuickLook.Plugin.Rhino3dmViewer) v1.0.2 (preview) | 2026-10-29 | [Link](https://github.com/Lech-S/QuickLook.Plugin.Rhino3dmViewer/releases/download/v1.0.2/QuickLook.Plugin.Rhino3dmViewer_v1.0.2.qlplugin) | Offline interactive Rhino `.3dm` previews with layers, object visibility, automatic colors and section planes. Saved display meshes required for Breps/extrusions. |\n```\n\nThe date should be replaced with the actual release date when publishing. Replace Lech-S with the authenticated repository owner's login before posting. Use a public repository and public release so the maintainers can review the source and download the package.\n", "docs/validation-results/browser-results.json": "[\n  {\n    \"test\": \"Automatic object colors are distinct and stable; original appearance is restored; C shortcut\",\n    \"passed\": true\n  },\n  {\n    \"test\": \"v8 rendering, layers, inherited visibility, wire, ortho, section, isolate, reset\",\n    \"passed\": true\n  },\n  {\n    \"test\": \"layered-v5.3dm\",\n    \"passed\": true,\n    \"objects\": 4,\n    \"warnings\": []\n  },\n  {\n    \"test\": \"layered-v6.3dm\",\n    \"passed\": true,\n    \"objects\": 4,\n    \"warnings\": []\n  },\n  {\n    \"test\": \"layered-v7.3dm\",\n    \"passed\": true,\n    \"objects\": 4,\n    \"warnings\": []\n  },\n  {\n    \"test\": \"mesh.3dm\",\n    \"passed\": true,\n    \"objects\": 1,\n    \"warnings\": []\n  },\n  {\n    \"test\": \"blocks.3dm\",\n    \"passed\": true,\n    \"objects\": 2,\n    \"warnings\": [\n      \"\u90e8\u5206\u66f2\u9762\u6216\u5b9e\u4f53\u6ca1\u6709\u4fdd\u5b58\u663e\u793a\u7f51\u683c\u3002\u8bf7\u5728 Rhino \u4e2d\u5207\u5230\u7740\u8272\u89c6\u56fe\uff0c\u6267\u884c Save\uff0c\u518d\u53d6\u6d88\u201c\u4ec5\u4fdd\u5b58\u51e0\u4f55\u4f53 / Save small\u201d\u3002\"\n    ]\n  },\n  {\n    \"test\": \"Automatic color also covers curves and point clouds; original data remains intact\",\n    \"passed\": true\n  },\n  {\n    \"test\": \"file3dm_stuff.3dm\",\n    \"passed\": true,\n    \"objects\": 13,\n    \"warnings\": [\n      \"\u90e8\u5206\u66f2\u9762\u6216\u5b9e\u4f53\u6ca1\u6709\u4fdd\u5b58\u663e\u793a\u7f51\u683c\u3002\u8bf7\u5728 Rhino \u4e2d\u5207\u5230\u7740\u8272\u89c6\u56fe\uff0c\u6267\u884c Save\uff0c\u518d\u53d6\u6d88\u201c\u4ec5\u4fdd\u5b58\u51e0\u4f55\u4f53 / Save small\u201d\u3002\"\n    ]\n  },\n  {\n    \"test\": \"empty.3dm error UI\",\n    \"passed\": true\n  },\n  {\n    \"test\": \"invalid.3dm error UI\",\n    \"passed\": true\n  },\n  {\n    \"test\": \"no-display-mesh.3dm error UI\",\n    \"passed\": true\n  },\n  {\n    \"test\": \"Host message binary transfer, no model fetch: layered-v8.3dm\",\n    \"passed\": true,\n    \"chunks\": 1\n  },\n  {\n    \"test\": \"Host message binary transfer, no model fetch: file3dm_stuff.3dm\",\n    \"passed\": true,\n    \"chunks\": 11\n  },\n  {\n    \"test\": \"Host read error is visible and retry succeeds\",\n    \"passed\": true\n  },\n  {\n    \"test\": \"No page exceptions and no external network requests\",\n    \"passed\": true\n  }\n]", "docs/validation-results/compile.log": "\nCompiler exit: 0\n", "docs/validation-results/native-transfer-results.log": "PASS chunk identity 0\nPASS bounded chunk 0\nPASS completion marker 1\nPASS chunk identity 1\nPASS bounded chunk 1\nPASS completion marker 2\nPASS chunk identity 2\nPASS bounded chunk 2\nPASS completion marker 3\nPASS chunk identity 3\nPASS bounded chunk 3\nPASS completion marker 4\nPASS multi-chunk bytes are exact; Unicod